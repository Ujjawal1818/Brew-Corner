<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poetry Generator</title>

</head>

<style> 
     
     body {
            background: #1e1e3f;
            font-family: serif;
            text-align: center;
            color: white;
            margin: 0;
            padding: 30px 15px;
            min-height: 100px;
            box-sizing: border-box;
        }
div{
  
     height: 300px;
     width: 300px;
     border: 1.5px solid black;    
  
     background-color: rgb(2, 98, 139);
     display: flex;
     align-items: center;
     justify-content: center;
     font-size: 20px;

     buttons {
      height: 400px;
      border-radius: 10px;
      font-size: 400px;
      font-weight:bold;
      border: none;
      cursor: pointer;
     }
     
}
hr {
            width: 70%;
            border: 2px solid #b9a0d3;
            margin: 25px auto;
        }

  </style>
<body>
  <center> 
    <h1>✦Poetry Generator✦</h1>
    <hr> 
    <div id="box">
      <b>Choose your poetry genre✨</b>
    </div>
    <br>
    <button onclick="document.getElementById('box').textContent='Khamoshiyon mein bhi ek awaaz hoti hai,Har muskurahat ke peeche ek baat hoti hai.Samajh paaye jo aankhon ki nami ko,Aise logon se hi dil ki mulaqat hoti hai.'"><b> Sad </b></button>
    <button onclick="document.getElementById('box').textContent='Humari khamoshi ko kamzori na samajhna,Har baat par apni zubaan nahi kholte. Waqt aane par jawaab bhi denge,Hum har kisi ke saamne apne raaz nahi kholte.'"><b>Angry</b></button>
    <button onclick="document.getElementById('box').textContent='Itihaas likhne ke liye kalam nahi, hausle ki zaroorat hoti hai.'"><b> Motivational </b></button>
    <button onclick="document.getElementById('box').textContent='Choose your poetry genre✨'"><b> Reset </b></button>

  </center>
</body>
</html>
